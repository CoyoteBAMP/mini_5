if(s==0){nt(M(ch[0]),t,4,.25,'sine');[1,2,3].forEach(function(i){nt(M(ch[i]),t,4.2,.05,'triangle')})}
nt(M(ch[[1,3,2,3,1,3,2,3][s]]+12),t,1.5,.09,'triangle');
if(s==2||(dn>1&&s==6)||(dn>2&&s==4))nt(M(ch[(step*3+s)%3+1]+24),t,1.9,.08,'sine');
if(cur==4&&s%2==0){nt(950,t,.3,.07,'sine');nt(1900,t,.12,.03,'sine')}
step++}
var cap=document.getElementById('cap'),sc=document.getElementById('sc'),ov=document.getElementById('ov');
function show(n){tm.forEach(function(x){clearTimeout(x);clearInterval(x)});tm=[];cur=n;var s=S[n];
sc.style.animation='none';sc.offsetHeight;sc.style.animation='';sc.innerHTML=s.f();
var L=s.t,gap=(s.d-5)*1000/L.length;cap.innerHTML='';
L.forEach(function(l,j){var p=document.createElement('p'),b=l[0]==='*';p.textContent=b?l.slice(1):l;if(b)p.className='big';p.style.animationDelay=(1000+j*gap)+'ms';cap.appendChild(p)});
if(s.i)s.i();
tm.push(setTimeout(function(){if(n<S.length-1)show(n+1);else end()},s.d*1000))}
function end(){if(mst)mst.gain.setTargetAtTime(0,AC.currentTime,2);ov.style.display='flex';ov.querySelector('h1').textContent='Fin';ov.querySelector('.s').textContent='Recuerda: creo en ti, Zaire.';document.getElementById('go').textContent='Volver a ver'}
document.getElementById('go').onclick=function(e){e.stopPropagation();ov.style.display='none';document.getElementById('mt').style.display='block';if(!AC)audio();else{mst.gain.cancelScheduledValues(0);mst.gain.value=.8}if(AC&&AC.state!=='running')AC.resume();step=0;show(0)};
document.getElementById('mt').onclick=function(e){e.stopPropagation();muted=!muted;this.textContent=muted?'🔇':'🔊';if(mst)mst.gain.value=muted?0:.8};
document.getElementById('app').addEventListener('click',function(){if(ov.style.display==='none'&&cur<S.length-1)show(cur+1)});
</script>
</body>
</html>
